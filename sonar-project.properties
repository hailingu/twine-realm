# 项目标识对应本地 SonarQube 已建立的 twine-realm 项目；服务地址和凭据仅由环境注入。
sonar.projectKey=twine-realm
sonar.projectName=twine-realm
sonar.sourceEncoding=UTF-8
sonar.sources=scripts,server,web/src,web/scripts,web/tooling
sonar.tests=scripts,server,web/src,web/e2e
# 独立业务源码只由集成测试导出，属于测试夹具；发布工程模板仍为生产源码。
sonar.test.inclusions=scripts/**/*.node.mjs,server/**/*_test.go,server/internal/httpapi/testdata/**/*.go,web/src/**/*.test.ts,web/src/**/*.test.tsx,web/src/testing/**,web/e2e/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/target/**,**/coverage/**,web/src/contract/**
# 完整门禁通过扫描参数注入本次临时目录的 LCOV，不读取历史覆盖率报告。
sonar.qualitygate.wait=true
